# tmux setup for exile sessions: a status bar on top marks the session as
# exiled, every key goes to the agent, and the mouse wheel scrolls back
# through its output.
set -g prefix None
unbind C-b
set -g mouse on
set -g history-limit 100000
set -s escape-time 0
set -s extended-keys on
set -g focus-events on
set -s set-clipboard on
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB:extkeys"

set -g status-position top
set -g status-interval 0
set -g status-style "bg=colour235,fg=colour250"
set -g status-left-length 80
set -g status-right-length 160
set -g window-status-format ""
set -g window-status-current-format ""

# Copies reach the clipboard on the host through exile: text selected with
# the mouse, and text the agent copies through tmux, such as Claude Code's
# login link with "c".
set -s copy-command exile-copy
set-hook -g after-load-buffer "run-shell -b 'tmux show-buffer | exile-copy'"
set-hook -g after-set-buffer "run-shell -b 'tmux show-buffer | exile-copy'"

# A click on the status bar asks exile on the host to open the settings
# page in the browser.
bind -n MouseDown1Status      run-shell -b "echo open-settings >> /run/exile-requests/requests"
bind -n MouseDown1StatusLeft  run-shell -b "echo open-settings >> /run/exile-requests/requests"
bind -n MouseDown1StatusRight run-shell -b "echo open-settings >> /run/exile-requests/requests"
